<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtitle Workspace - Open Immerse Translate</title>
  <link rel="stylesheet" href="subtitle.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M5 9h6v2H5V9Zm0 4h4v2H5v-2Zm6 0h7v2h-7v-2Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-copy">
          <strong data-i18n="subtitleWorkspace">字幕翻译工作台</strong>
          <small data-i18n="subtitleWorkspaceDesc">导入 SRT 或 WebVTT，保留时间轴生成双语字幕</small>
        </span>
      </div>
      <div class="topbar-actions">
        <div class="provider-summary" id="providerSummary">
          <span class="provider-dot" id="providerDot"></span>
          <span id="providerName">Google</span>
        </div>
        <button class="button button-quiet" id="settingsBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.04 1.56V20.3h-3v-.08a1.7 1.7 0 0 0-1.04-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.56-1.04H5.36v-3h.08A1.7 1.7 0 0 0 7 9.92a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.12-2.12.06.06A1.7 1.7 0 0 0 10.66 6a1.7 1.7 0 0 0 1.04-1.56v-.08h3v.08A1.7 1.7 0 0 0 15.74 6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.04h.08v3h-.08A1.7 1.7 0 0 0 19.4 15Z" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span data-i18n="subtitleSettings">设置</span>
        </button>
      </div>
    </header>

    <main class="main-shell">
      <section class="import-view" id="importView">
        <div class="import-intro">
          <p class="eyebrow">SRT / WEBVTT</p>
          <h1 data-i18n="importSubtitle">导入字幕</h1>
          <p data-i18n="subtitleWorkspaceDesc">导入 SRT 或 WebVTT，保留时间轴生成双语字幕</p>
        </div>
        <input
          id="fileInput"
          type="file"
          accept=".srt,.vtt,text/vtt,application/x-subrip,text/plain"
          hidden
        >
        <button class="drop-zone" id="chooseFileBtn" type="button">
          <span class="drop-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 15v4a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <strong data-i18n="dropSubtitle">拖入 SRT 或 WebVTT 文件</strong>
          <span data-i18n="importSubtitleHint">或点击选择文件，单个文件不超过 10 MB</span>
          <span class="button button-primary choose-file-label" data-i18n="chooseFile">选择文件</span>
        </button>
        <div class="format-strip" aria-hidden="true">
          <span>UTF-8 / UTF-16 BOM</span>
          <span>SRT</span>
          <span>WebVTT</span>
          <span>Multiline cues</span>
        </div>
      </section>

      <section class="workspace" id="workspace" hidden>
        <aside class="control-panel">
          <div class="file-summary">
            <span class="file-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M6 2h8l4 4v16H6V2Z" stroke="currentColor" stroke-width="1.7"/>
                <path d="M14 2v5h5M9 13h6M9 17h6" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </span>
            <div>
              <strong id="fileName">subtitle.srt</strong>
              <span id="fileMeta">0 cues</span>
            </div>
          </div>

          <div class="control-section">
            <div class="field">
              <label for="sourceLang" data-i18n="sourceLang">源语言</label>
              <select id="sourceLang">
                <option value="auto" data-i18n="autoDetectLang">自动检测</option>
                <option value="en">English</option>
                <option value="zh-CN">简体中文</option>
                <option value="zh-TW">繁體中文</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="es">Español</option>
                <option value="ru">Русский</option>
                <option value="ar">العربية</option>
                <option value="pt">Português</option>
                <option value="it">Italiano</option>
                <option value="vi">Tiếng Việt</option>
                <option value="th">ไทย</option>
              </select>
            </div>
            <div class="field">
              <label for="targetLang" data-i18n="targetLang">目标语言</label>
              <select id="targetLang">
                <option value="zh-CN">简体中文</option>
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="es">Español</option>
                <option value="ru">Русский</option>
                <option value="ar">العربية</option>
                <option value="pt">Português</option>
                <option value="it">Italiano</option>
                <option value="vi">Tiếng Việt</option>
                <option value="th">ไทย</option>
              </select>
            </div>
          </div>

          <div class="control-section action-stack">
            <button class="button button-primary" id="translateBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m5 8 3 3 5-6M13 19l2.5-7 2.5 7m-4.3-2.5h3.6M4 15h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span data-i18n="subtitleTranslate">开始翻译</span>
            </button>
            <button class="button button-danger" id="cancelBtn" type="button" hidden>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
              </svg>
              <span data-i18n="stopTranslate">停止翻译</span>
            </button>
            <button class="button button-quiet" id="clearBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 7h16M9 3h6l1 4H8l1-4Zm-2 4 1 14h8l1-14M10 11v6M14 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              <span data-i18n="subtitleClear">清除译文</span>
            </button>
          </div>

          <div class="progress-block" id="progressBlock" hidden>
            <div class="progress-copy">
              <span id="progressLabel" data-i18n="subtitleReady">已就绪</span>
              <span id="progressCount">0/0</span>
            </div>
            <div
              class="progress-track"
              id="progressTrack"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <span id="progressBar"></span>
            </div>
            <p id="progressDetail">0/0</p>
          </div>

          <div class="control-section export-section">
            <span class="section-label" data-i18n="subtitleExportSrt">导出双语 SRT</span>
            <label class="checkbox-row">
              <input type="checkbox" id="includeSource" checked>
              <span data-i18n="subtitleIncludeOriginal">导出时包含原文</span>
            </label>
            <button class="button button-secondary" id="exportSrtBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>SRT</span>
            </button>
            <button class="button button-secondary" id="exportVttBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>WebVTT</span>
            </button>
          </div>

          <details class="warning-panel" id="warningPanel" hidden>
            <summary id="warningSummary">0</summary>
            <ul id="warningList"></ul>
          </details>

          <button class="text-button" id="replaceFileBtn" type="button">
            <span data-i18n="subtitleChooseFileAgain">更换文件</span>
          </button>
        </aside>

        <section class="editor-panel">
          <header class="editor-header">
            <div>
              <p class="eyebrow" id="formatLabel">SRT</p>
              <h2 id="editorTitle">subtitle.srt</h2>
            </div>
            <div class="editor-meta">
              <span id="segmentCount">0 translation segments</span>
              <span class="meta-divider" aria-hidden="true"></span>
              <span id="translationCount">0/0 segments translated</span>
              <span class="editable-hint" data-i18n="subtitleEditableHint">译文可直接修改</span>
            </div>
          </header>
          <div class="cue-head" aria-hidden="true">
            <span>#</span>
            <span data-i18n="sourceLang">源语言</span>
            <span data-i18n="targetLang">目标语言</span>
          </div>
          <div class="cue-list" id="cueList"></div>
        </section>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="cueRowTemplate">
    <article class="cue-row">
      <div class="cue-index">
        <span class="cue-number"></span>
        <time class="cue-time"></time>
        <span class="cue-state"></span>
      </div>
      <p class="cue-source"></p>
      <textarea class="cue-translation" rows="2" spellcheck="true"></textarea>
    </article>
  </template>

  <script src="../shared/prompt-policy.js"></script>
  <script src="../shared/translation-core.js"></script>
  <script src="../shared/providers.js"></script>
  <script src="../shared/extension-config.js"></script>
  <script src="../shared/subtitle-core.js"></script>
  <script src="../shared/subtitle-controller.js"></script>
  <script src="../popup/i18n.js"></script>
  <script src="subtitle.js" type="module"></script>
</body>
</html>
