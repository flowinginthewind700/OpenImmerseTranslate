<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Subtitle core browser tests</title>
</head>
<body>
  <script src="../shared/subtitle-core.js"></script>
  <script>
    window.runSubtitleCoreTests = () => {
      const core = window.OITSubtitleCore;
      const tests = [];
      const assert = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      const test = (name, fn) => tests.push({ name, fn });

      test('parses BOM, CRLF, multiline SRT and cleans presentation tags', () => {
        const source = [
          '\uFEFF1',
          '00:00:01,250 --> 00:00:03,500',
          '<b>Hello</b> &amp; welcome.',
          'Second line.',
          '',
          '2',
          '00:00:04,000 --> 00:00:05,100',
          '<i>Next cue</i>',
        ].join('\r\n');

        const document = core.parseSubtitle(source, { filename: 'sample.srt' });
        assert(document.format === 'srt', 'SRT format was not detected');
        assert(document.cues.length === 2, `expected 2 cues, got ${document.cues.length}`);
        assert(document.cues[0].start === 1.25 && document.cues[0].end === 3.5,
          'SRT timestamps were parsed incorrectly');
        assert(document.cues[0].text === 'Hello & welcome. Second line.',
          `SRT text was not cleaned: ${document.cues[0].text}`);
        assert(document.cues[1].text === 'Next cue', 'italic markup was retained');
      });

      test('parses WebVTT headers, notes, identifiers, settings and short timestamps', () => {
        const source = [
          'WEBVTT',
          '',
          'NOTE generated by a test fixture',
          '',
          'intro',
          '00:01.000 --> 00:03.250 align:start position:10%',
          'Welcome <v Narrator>back</v>.',
          '',
          '01:02:03.500 --> 01:02:04.750',
          'Later cue',
        ].join('\n');

        const document = core.parseSubtitle(source);
        assert(document.format === 'vtt', 'WebVTT format was not detected');
        assert(document.cues.length === 2, 'WebVTT metadata leaked into cues');
        assert(document.cues[0].start === 1 && document.cues[0].end === 3.25,
          'short WebVTT timestamps were parsed incorrectly');
        assert(document.cues[0].text === 'Welcome back.', 'WebVTT voice markup was retained');
        assert(document.cues[1].start === 3723.5, 'long WebVTT timestamp was parsed incorrectly');
      });

      test('rejects malformed timing blocks without dropping valid cues', () => {
        const source = [
          '1',
          '00:00:05,000 --> 00:00:04,000',
          'Backwards',
          '',
          '2',
          'not a timestamp',
          'Invalid',
          '',
          '3',
          '00:00:06,000 --> 00:00:07,000',
          'Valid',
        ].join('\n');

        const document = core.parseSubtitle(source, { filename: 'mixed.srt' });
        assert(document.cues.length === 1, 'invalid timing blocks were emitted');
        assert(document.cues[0].text === 'Valid', 'valid cue after malformed blocks was lost');
        assert(document.warnings.length === 2, 'malformed blocks were not recorded');
      });

      test('ignores WebVTT metadata blocks even when their payload resembles timing', () => {
        const source = [
          'WEBVTT',
          '',
          'NOTE provider diagnostic',
          '00:00:01.000 --> 00:00:02.000',
          'This line is metadata, not a cue.',
          '',
          'STYLE',
          '::cue { color: lime; }',
          '',
          'real-cue',
          '00:00:03.000 --> 00:00:04.000',
          'Actual subtitle.',
        ].join('\n');

        const document = core.parseSubtitle(source);
        assert(document.cues.length === 1, 'WebVTT metadata was emitted as a cue');
        assert(document.cues[0].text === 'Actual subtitle.',
          'the real cue after WebVTT metadata was not preserved');
      });

      test('merges short non-overlapping cues but preserves sentence and duration limits', () => {
        const document = core.parseSubtitle([
          'WEBVTT',
          '',
          '00:00:00.000 --> 00:00:00.400',
          'Hello',
          '',
          '00:00:00.800 --> 00:00:01.200',
          'world',
          '',
          '00:00:02.200 --> 00:00:02.600',
          'Next sentence.',
          '',
          '00:00:02.700 --> 00:00:03.000',
          'A new thought',
        ].join('\n'));
        const segments = core.buildSegments(document.cues, {
          mergeGapSeconds: 0.6,
          maxDurationSeconds: 10,
        });

        assert(segments.map(segment => segment.sourceText).join('|')
          === 'Hello world|Next sentence.|A new thought',
        `unexpected segment grouping: ${segments.map(segment => segment.sourceText).join('|')}`);
      });

      test('splits oversized word and CJK cues without losing source text', () => {
        const words = Array.from({ length: 45 }, (_, index) => `word${index}`).join(' ');
        const cjk = '字'.repeat(65);
        const cues = [
          { id: 'words', start: 0, end: 9, text: words },
          { id: 'cjk', start: 10, end: 19, text: cjk },
        ];
        const segments = core.buildSegments(cues, {
          maxCharacters: 80,
          maxCjkCharacters: 30,
          sourceLang: 'auto',
        });
        const wordParts = segments.filter(segment => segment.text === words);
        const cjkParts = segments.filter(segment => segment.text === cjk);

        assert(wordParts.length > 1 && cjkParts.length > 1,
          'oversized cues were not split');
        assert(wordParts.length + cjkParts.length === segments.length,
          'oversized cue was not assigned a stable source text identity');
        assert(segments.filter(segment => segment.sourceCueId === 'words')
          .every(segment => segment.text === words),
        'word cue parts did not retain the original cue text');
        assert(segments.filter(segment => segment.sourceCueId === 'cjk')
          .every(segment => segment.text === cjk),
        'CJK cue parts did not retain the original cue text');
        assert(segments.filter(segment => segment.sourceCueId === 'words')
          .flatMap(segment => segment.sourceText.split(/\s+/)).join(' ')
          === words, 'word cue splitting lost or reordered words');
        assert(segments.filter(segment => segment.sourceCueId === 'cjk')
          .map(segment => segment.sourceText).join('') === cjk,
        'CJK cue splitting lost or reordered characters');
        assert(segments.filter(segment => segment.sourceCueId === 'words')
          .every(segment => segment.end > segment.start), 'split cue has an empty duration');
      });

      test('creates bounded translation batches without crossing character budgets', () => {
        const segments = Array.from({ length: 7 }, (_, index) => ({
          id: `segment-${index}`,
          sourceText: 'x'.repeat(index === 3 ? 12 : 4),
        }));
        const batches = core.createTranslationBatches(segments, {
          maxItems: 3,
          maxCharacters: 12,
        });

        assert(batches.length === 3, `unexpected batch count: ${batches.length}`);
        assert(batches.every(batch => batch.length <= 3), 'item budget was exceeded');
        assert(batches.every(batch => (
          batch.reduce((total, segment) => total + segment.sourceText.length, 0) <= 12
        )), 'character budget was exceeded');
        assert(batches.flat().map(segment => segment.id).join(',')
          === segments.map(segment => segment.id).join(','), 'batch ordering changed');
      });

      test('exports bilingual SRT and VTT that round-trip through the parser', () => {
        const segments = [
          {
            id: 'segment-1',
            start: 1.25,
            end: 3.5,
            sourceText: 'Hello world.',
            translatedText: '你好，世界。',
          },
          {
            id: 'segment-2',
            start: 3723.5,
            end: 3724.75,
            sourceText: 'Later cue',
            translatedText: '稍后的字幕',
          },
        ];

        const srt = core.serializeSubtitles(segments, { format: 'srt' });
        const parsedSrt = core.parseSubtitle(srt, { filename: 'bilingual.srt' });
        assert(parsedSrt.cues[0].start === 1.25 && parsedSrt.cues[1].start === 3723.5,
          'SRT export did not preserve timestamps');
        assert(parsedSrt.cues[0].text.includes('Hello world.')
          && parsedSrt.cues[0].text.includes('你好，世界。'), 'SRT export omitted bilingual text');

        const vtt = core.serializeSubtitles(segments, { format: 'vtt' });
        const parsedVtt = core.parseSubtitle(vtt);
        assert(parsedVtt.format === 'vtt', 'VTT export omitted the WEBVTT header');
        assert(parsedVtt.cues.length === 2, 'VTT export round-trip changed cue count');
        assert(parsedVtt.cues[1].text.includes('稍后的字幕'), 'VTT export omitted translation');
      });

      test('numbers exported SRT cues sequentially when empty segments are skipped', () => {
        const output = core.serializeSubtitles([
          {
            id: 'missing',
            start: 1,
            end: 2,
            sourceText: 'Untranslated source',
            translatedText: '',
          },
          {
            id: 'translated',
            start: 3,
            end: 4,
            sourceText: 'Translated source',
            translatedText: 'Translated output',
          },
        ], {
          format: 'srt',
          includeSource: false,
        });

        assert(output.startsWith('1\n00:00:03,000 --> 00:00:04,000\n'),
          `SRT cue numbering has a gap: ${output}`);
      });

      test('carries millisecond rounding across second and minute boundaries', () => {
        assert(core.formatTimestamp(59.9996, 'srt') === '00:01:00,000',
          `minute carry failed: ${core.formatTimestamp(59.9996, 'srt')}`);
        assert(core.formatTimestamp(3599.9996, 'vtt') === '01:00:00.000',
          `hour carry failed: ${core.formatTimestamp(3599.9996, 'vtt')}`);
      });

      const failures = [];
      for (const item of tests) {
        try {
          item.fn();
        } catch (error) {
          failures.push({ name: item.name, error: error.stack || error.message });
        }
      }
      return { total: tests.length, failures };
    };
  </script>
</body>
</html>
