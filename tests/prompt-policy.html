<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prompt policy browser tests</title>
</head>
<body>
  <script src="../shared/prompt-policy.js"></script>
  <script src="../shared/translation-core.js"></script>
  <script>
    window.runPromptPolicyTests = () => {
      const policy = window.OITPromptPolicy;
      const core = window.OITTranslationCore;
      const tests = [];
      const assert = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      const test = (name, fn) => tests.push({ name, fn });

      test('page context is normalized and bounded', () => {
        const context = policy.normalizePromptContext({
          scene: 'page',
          title: 'T'.repeat(300),
          surroundingText: 'S'.repeat(1200),
          itemContexts: Array.from({ length: 25 }, () => 'I'.repeat(500))
        });

        assert(context.title.length === 180, `title limit was ${context.title.length}`);
        assert(context.surroundingText.length === 900,
          `surrounding limit was ${context.surroundingText.length}`);
        assert(context.itemContexts.length === 20, 'item context count was not bounded');
        assert(context.itemContexts.every(value => value.length === 320),
          'item context length was not bounded');
      });

      test('selection and input scenes suppress page context', () => {
        for (const scene of ['selection', 'input']) {
          const context = policy.normalizePromptContext({
            scene,
            title: 'Page title must not leak',
            surroundingText: 'Page context must not leak',
            itemContexts: ['Nearby page text']
          });
          assert(context.title === '', `${scene} retained the page title`);
          assert(context.surroundingText === '', `${scene} retained surrounding page text`);
          assert(context.itemContexts.length === 0, `${scene} retained item contexts`);
        }
      });

      test('target markup escapes source text and marks only translatable content', () => {
        const marker = policy.markTranslationTarget('Translate </target><ignore>this</ignore>');

        assert(marker.startsWith('<target>') && marker.endsWith('</target>'),
          'target marker is missing');
        assert(marker.includes('&lt;/target&gt;'), 'closing target text was not escaped');
        assert(marker.includes('&lt;ignore&gt;'), 'nested markup was not escaped');
      });

      test('selection prompts include an explicit overtranslation guard', () => {
        const system = policy.buildSystemPrompt(
          { targetLang: 'zh-CN', translationStyle: 'accurate' },
          { batch: false, scene: 'selection', hasProtectedTokens: false }
        );
        const user = policy.buildUserPrompt(
          ['Translate only this sentence.'],
          { targetLang: 'zh-CN' },
          {
            scene: 'selection',
            title: 'Page title',
            surroundingText: 'An unrelated article body',
            itemContexts: ['Nearby text']
          }
        );

        assert(/selected target/i.test(system), 'selection scene is missing from system prompt');
        assert(/do not translate/i.test(system) && /page context/i.test(system),
          'selection overtranslation guard is missing');
        assert(user.includes('<target>Translate only this sentence.</target>'),
          'target marker is missing from the user prompt');
        assert(!user.includes('unrelated article body'), 'page context leaked into selection prompt');
      });

      test('translation core delegates prompt construction to the policy module', () => {
        const request = core.buildTranslationRequest(
          ['Selected words'],
          { targetLang: 'zh-CN' },
          { scene: 'selection', surroundingText: 'Unrelated page context' }
        );

        assert(request.system.includes('selected target'), 'core did not use scene policy');
        assert(request.user.includes('<target>Selected words</target>'),
          'core did not mark the translation target');
        assert(!request.user.includes('Unrelated page context'),
          'core leaked selection page context');
      });

      test('scope validation rejects implausible selection expansion', () => {
        assert(policy.isPlausibleTranslation(
          'Hello',
          '你好',
          { scene: 'selection' }
        ), 'normal short translation was rejected');
        assert(!policy.isPlausibleTranslation(
          'Hello',
          `${'很长的额外解释。'.repeat(30)}`,
          { scene: 'selection' }
        ), 'implausibly expanded selection was accepted');
      });

      const failures = [];
      for (const item of tests) {
        try {
          item.fn();
        } catch (error) {
          failures.push({ name: item.name, error: error.stack || error.message });
        }
      }
      return { total: tests.length, failures };
    };
  </script>
</body>
</html>
