        local: { get() { return Promise.resolve({}); }, set() { return Promise.resolve(); } }

  <script>
    window.runContentIntegrationTests = async () => {
      const tests = [];
      const assert = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      const pseudoTranslate = source => source
        .split(/(\[\[OIT-[A-Z0-9]+:(?:OPEN|CLOSE|ATOM):\d+\]\])/g)
        .map((part, index) => index % 2 === 1
          ? part
          : part.replace(/[A-Za-z]+/g, match => `译${match}`))
        .join('');
      const test = (name, fn) => tests.push({ name, fn });
      const resetContentState = () => {
        state.fullReset();
        translationRecords.clear();
        titleRecord = null;
      };

      test('batch refresh switches an existing block to translation-only templates', () => {
        document.body.innerHTML = '<button id="host">Save changes</button>';
        const host = document.querySelector('#host');
        const sourceText = host.firstChild;
        let clicks = 0;
        host.addEventListener('click', () => clicks++);
        host.focus();

        state.config = {
          showOriginal: true,
          autoDetect: false,
          targetLang: 'en'
        };
        const block = prepareTranslationBlock(host);
        assert(block && block.inPlaceTemplate === null, 'bilingual block was not prepared');

        state.config = {
          showOriginal: false,
          autoDetect: false,
          targetLang: 'en'
        };
        assert(refreshTranslationBlock(block), 'queued block could not be refreshed');
        assert(block.template === block.inPlaceTemplate,
          'refreshed block retained the stale bilingual template');
        assert(applyTranslation(block, pseudoTranslate(block.text)),
          'refreshed translation-only block was not applied');

        const record = translationRecords.get(host);
        assert(record?.kind === 'in-place', 'content path did not use in-place translation');
        assert(host.firstChild === sourceText, 'content path replaced the source Text node');
        assert(document.activeElement === host, 'content path lost focus');
        host.click();
        assert(clicks === 1, 'content path removed the existing click listener');

        removeAllTranslations();
        assert(host.textContent === 'Save changes', 'translation-only restore changed the source text');
        assert(host.firstChild === sourceText, 'translation-only restore replaced the source Text node');
        assert(document.activeElement === host, 'translation-only restore lost focus');
      });

      test('translation-only content path preserves nested links and exact source markup', () => {
        document.body.innerHTML = '<p id="host">Read <a id="story" href="/story">the full story</a> now.</p>';
        const host = document.querySelector('#host');
        const link = document.querySelector('#story');
        const textNodes = Array.from(host.childNodes).filter(node => node.nodeType === Node.TEXT_NODE);
        const originalHtml = host.innerHTML;
        let clicks = 0;
        link.addEventListener('click', event => {
          event.preventDefault();
          clicks++;
        });
        link.focus();

        state.config = {
          showOriginal: false,
          autoDetect: false,
          targetLang: 'en'
        };
        const block = prepareTranslationBlock(host);
        assert(block?.inPlaceTemplate, 'nested-link block did not receive an in-place template');
        assert(applyTranslation(block, pseudoTranslate(block.text)),
          'nested-link translation was not applied');

        assert(translationRecords.get(host)?.kind === 'in-place',
          'nested-link translation did not use in-place mode');
        assert(document.querySelector('#story') === link, 'nested link identity changed');
        assert(document.activeElement === link, 'nested link lost focus');
        link.click();
        assert(clicks === 1, 'nested link listener was removed');
        assert(link.textContent.includes('译'), 'nested link label was not translated');

        removeAllTranslations();
        assert(host.innerHTML === originalHtml, 'nested-link source markup was not restored exactly');
        assert(document.querySelector('#story') === link, 'restore replaced the nested link');
        assert(Array.from(host.childNodes).filter(node => node.nodeType === Node.TEXT_NODE)
          .every((node, index) => node === textNodes[index]),
        'restore replaced direct source Text nodes');
        assert(document.activeElement === link, 'restore lost nested-link focus');
      });

      test('unitized mixed text translates safely and unwraps to the exact source nodes', () => {
        resetContentState();
        document.body.innerHTML = `
          <main>
            <div id="mixed">
              Read <a id="guide" href="/guide">the guide</a> before continuing.
              <p id="nested">The nested paragraph remains independent.</p>
              <button id="save">Save changes</button>
            </div>
          </main>
        `;
        const mixed = document.querySelector('#mixed');
        const guide = document.querySelector('#guide');
        const sourceNodes = Array.from(mixed.childNodes);
        state.config = {
          showOriginal: false,
          autoDetect: false,
          targetLang: 'en',
          translationScope: 'full'
        };
        state.scope = 'full';

        const blocks = collectViewportBlocks();
        const block = blocks.find(candidate => (
          candidate.element.matches?.('.oit-direct-text-run')
        ));
        assert(block, 'mixed direct text was not prepared as a content block');
        assert(block.element.contains(guide), 'prepared content unit lost its inline link');
        assert(applyTranslation(block, pseudoTranslate(block.text)),
          'unitized mixed text was not translated');
        assert(guide.textContent.includes('译'), 'inline link label was not translated');

        removeAllTranslations();
        assert(!mixed.querySelector('.oit-direct-text-run'),
          'restore left a synthetic direct-text-run wrapper behind');
        assert(document.querySelector('#guide') === guide, 'restore replaced the inline link');
        assert(Array.from(mixed.childNodes).every(
          (node, index) => node === sourceNodes[index]
        ), 'restore changed direct source node identity or order');
        assert(mixed.textContent.includes('Read the guide before continuing.'),
          'restore did not recover the exact source text');
      });

      test('dynamic mixed content is unitized once without rescanning its synthetic wrapper', async () => {
        resetContentState();
        document.body.innerHTML = `
          <main id="dynamic-main">
            <p id="existing-copy">Existing readable content keeps the page root stable.</p>
          </main>
        `;
        state.config = {
          showOriginal: false,
          autoDetect: false,
          targetLang: 'en',
          translationScope: 'full'
        };
        state.scope = 'full';
        state.isActive = true;
        state.shouldStop = false;
        ensureScanContext();

        const originalProcessQueue = processQueue;
        processQueue = () => Promise.resolve();
        // Keep the queue observable and prevent this DOM behavior test from
        // depending on a provider response.
        state.activeTranslations = CONFIG.MAX_CONCURRENT;

        try {
          startMutationObserver();
          const mixed = document.createElement('div');
          mixed.id = 'dynamic-mixed';
          mixed.innerHTML = `
            Read <a id="dynamic-guide" href="/guide">the dynamic guide</a> before continuing.
            <p id="dynamic-nested">The nested paragraph remains independent.</p>
            <button id="dynamic-save">Save changes</button>
          `;
          document.querySelector('#dynamic-main').append(mixed);
          const guide = document.querySelector('#dynamic-guide');

          await sleep(CONFIG.MUTATION_DEBOUNCE + 120);

          const wrappers = mixed.querySelectorAll('.oit-direct-text-run');
          assert(wrappers.length === 1,
            `dynamic insertion created ${wrappers.length} direct-text-run wrappers`);
          assert(wrappers[0].contains(guide), 'dynamic inline link was not kept in its text run');
          assert(!state.translationQueue.some(block => block.element === guide),
            'synthetic wrapper mutations re-enqueued the inline link as a duplicate unit');
          assert(state.pendingDynamicRoots.size === 0,
            'synthetic unitization mutations were left pending for another scan');
          assert(state.mutationTimer === null,
            'synthetic unitization mutations scheduled a redundant observer scan');
        } finally {
          processQueue = originalProcessQueue;
          state.fullReset();
        }
      });

      test('a settled translation session still rescans a revealed navigation menu', async () => {
        resetContentState();
        document.body.innerHTML = `
          <header id="observer-header">
            <nav id="observer-nav">
              <button id="observer-trigger" type="button" aria-expanded="false">More</button>
              <div id="observer-menu" role="menu" hidden>
                <a id="observer-settings" href="/settings" role="menuitem">Settings</a>
              </div>
            </nav>
          </header>
          <main><article><p id="observer-copy">Readable body content anchors the smart reading view.</p></article></main>
        `;
        state.config = {
          showOriginal: false,
          autoDetect: false,
          targetLang: 'en',
          translationScope: 'smart'
        };
        state.scope = 'smart';
        state.isActive = true;
        state.shouldStop = false;
        state.bodyTranslatedCount = 1;
        ensureScanContext();

        const originalProcessQueue = processQueue;
        processQueue = () => Promise.resolve();

        try {
          startMutationObserver();
          assert(settleTranslationPipeline(),
            'initial translation pipeline did not settle');
          assert(state.isActive,
            'settled pipeline stopped the page translation session');

          // Keep the revealed menu observable in the queue without allowing the
          // stubbed queue processor to consume it.
          state.activeTranslations = CONFIG.MAX_CONCURRENT;
          document.querySelector('#observer-menu').hidden = false;
          document.querySelector('#observer-trigger').setAttribute('aria-expanded', 'true');

          await sleep(CONFIG.MUTATION_DEBOUNCE + 120);
          assert(
            state.translationQueue.some(block => block.element.id === 'observer-settings'),
            'revealed navigation menu was not queued after attribute mutations'
          );
        } finally {
          processQueue = originalProcessQueue;
          state.fullReset();
        }
      });

      test('settled X sessions ignore volatile class and style mutations', () => {
        resetContentState();
        createFAB({ right: 20, top: '50%' });
        document.body.insertAdjacentHTML('afterbegin', `
          <main id="x-observer-main">
            <article id="x-observer-post" lang="en">
              <div id="x-observer-post-body"
                   data-testid="tweetText"
                   lang="en"
                   dir="auto">
                A completed post should not start another scan for React style changes.
              </div>
            </article>
          </main>
        `);
        const post = document.querySelector('#x-observer-post');
        const postBody = document.querySelector('#x-observer-post-body');
        state.config = {
          showOriginal: true,
          autoDetect: false,
          targetLang: 'zh-CN',
          translationScope: 'smart'
        };
        state.scope = 'smart';
        state.isActive = true;
        state.shouldStop = false;
        state.bodyTranslatedCount = 1;
        state.completedElements.add(postBody);
        state.lifecycle.start();
        state.lifecycle.markActivity();
        assert(settleTranslationPipeline(),
          'completed X fixture did not settle initially');
        updateFabStatus('completed');

        try {
          handleDynamicMutations([
            {
              type: 'attributes',
              target: post,
              attributeName: 'class',
              oldValue: 'r-kzbkwu',
              addedNodes: [],
              removedNodes: []
            },
            {
              type: 'attributes',
              target: post,
              attributeName: 'style',
              oldValue: 'transform: translateY(0px);',
              addedNodes: [],
              removedNodes: []
            }
          ]);

          assert(state.pendingDynamicRoots.size === 0,
            'volatile X attributes queued redundant dynamic roots');
          assert(state.mutationTimer === null,
            'volatile X attributes scheduled a redundant dynamic scan');
          assert(state.pipelineSettled,
            'volatile X attributes reopened a settled pipeline');
          assert(!isTranslationPipelineBusy(),
            'volatile X attributes restarted the page loading state');
          assert(!fab?.querySelector('.oit-fab-btn')?.classList.contains('translating'),
            'volatile X attributes restarted the floating button spinner');
        } finally {
          hideFAB();
          state.fullReset();
        }
      });

      test('settled X sessions translate posts in opaque virtualized wrappers', async () => {
        resetContentState();
        hideFAB();
        const originalSendMessage = chrome.runtime.sendMessage;
        const waitFor = async (predicate, timeout = 2000) => {
          const deadline = performance.now() + timeout;
          while (performance.now() < deadline) {
            if (predicate()) return true;
            await sleep(20);
          }
          return predicate();
        };

        document.body.innerHTML = `
          <main id="x-virtualized-main">
            <article id="x-existing-post">
              <div id="x-existing-body"
                   data-testid="tweetText"
                   lang="en"
                   dir="auto">
                Existing timeline content anchors the smart reading root.
              </div>
            </article>
          </main>
        `;
        state.config = {
          showOriginal: false,
          autoDetect: false,
          targetLang: 'zh-CN',
          translationScope: 'smart'
        };
        state.scope = 'smart';
        state.isActive = true;
        state.shouldStop = false;
        state.bodyTranslatedCount = 1;
        state.completedElements.add(document.querySelector('#x-existing-body'));
        state.lifecycle.start();
        state.lifecycle.markActivity();
        state.scanContext = pageScanner.createScanContext({
          scope: 'smart',
          site: 'x'
        });
        pageScanner.collectPageCandidates('smart', {
          context: state.scanContext,
          site: 'x'
        });
        chrome.runtime.sendMessage = message => {
          if (message.action === 'abortRequest') {
            return Promise.resolve({ success: true });
          }
          if (message.action !== 'translate') {
            return Promise.resolve({ translations: [] });
          }
          return Promise.resolve({
            translations: message.texts.map(pseudoTranslate)
          });
        };

        try {
          assert(settleTranslationPipeline(),
            'completed X fixture did not settle before virtualization');
          startMutationObserver();

          const wrapper = document.createElement('x-timeline-cell');
          wrapper.id = 'x-late-timeline-cell';
          wrapper.innerHTML = `
            <article id="x-late-post-one">
              <div id="x-late-body-one"
                   data-testid="tweetText"
                   lang="en"
                   dir="auto">
                The first virtualized post appears after the initial session settled.
              </div>
            </article>
            <article id="x-late-post-two">
              <div id="x-late-body-two"
                   data-testid="tweetText"
                   lang="en"
                   dir="auto">
                The second virtualized post must translate in the same mutation batch.
              </div>
            </article>
          `;
          const wrapperIdentity = wrapper;
          const firstArticle = wrapper.querySelector('#x-late-post-one');
          const secondArticle = wrapper.querySelector('#x-late-post-two');
          document.body.append(wrapper);

          const translated = await waitFor(() => (
            translationRecords.has(document.querySelector('#x-late-body-one'))
            && translationRecords.has(document.querySelector('#x-late-body-two'))
          ));
          assert(translated,
            `late virtualized X posts were not translated: `
              + `${JSON.stringify(state.dynamicDiagnostics)}`);
          assert(document.querySelector('#x-late-timeline-cell') === wrapperIdentity
              && document.querySelector('#x-late-post-one') === firstArticle
              && document.querySelector('#x-late-post-two') === secondArticle,
          'virtualized X translation replaced timeline nodes');
          assert(await waitFor(() => isTranslationPipelineIdle()),
            'virtualized X translation did not return the pipeline to idle');
          assert(settleTranslationPipeline(),
            'virtualized X translation did not settle the existing session');
          assert(state.isActive,
            'virtualized X translation stopped future dynamic observation');
        } finally {
          chrome.runtime.sendMessage = originalSendMessage;
          removeAllTranslations();
          state.fullReset();
        }
      });

      test('observer translates late identifier-free X posts and sidebar cards', async () => {
        resetContentState();
        hideFAB();
        const originalSendMessage = chrome.runtime.sendMessage;
        const waitFor = async (predicate, timeout = 2500) => {
          const deadline = performance.now() + timeout;
          while (performance.now() < deadline) {
            if (predicate()) return true;
            await sleep(20);
          }
          return predicate();
        };

        document.title = 'Identifier-free X dynamic content';
        document.body.innerHTML = `
          <main role="main"
                style="display:flex;gap:20px;align-items:flex-start;
                       width:960px;height:620px">
            <section id="x-semantic-center"
                     style="display:block;width:600px;min-height:520px">
              <article id="x-semantic-post">
                <div id="x-semantic-existing-body"
                     lang="en"
                     dir="auto"
                     style="display:block;width:580px;min-height:48px">
                  Existing timeline content establishes the smart reading root.
                </div>
                <div id="x-semantic-late-body-shell"
                     style="display:block;width:580px"></div>
              </article>
            </section>
            <div id="x-semantic-right"
                 style="display:block;width:320px;min-height:520px">
              <aside aria-label="What is happening"
                     style="display:block;width:300px;min-height:480px">
                <h2 id="x-semantic-sidebar-heading">What is happening</h2>
                <div id="x-semantic-late-sidebar-shell"
                     style="display:block;width:280px"></div>
              </aside>
            </div>
          </main>
        `;
        state.config = {
          showOriginal: true,
          autoDetect: false,
          targetLang: 'zh-CN',
          maxConcurrent: 4,
          translationScope: 'smart'
        };
        state.scope = 'smart';
        state.isActive = true;
        state.shouldStop = false;
        state.lifecycle.start();
        state.scanContext = pageScanner.createScanContext({
          scope: 'smart',
          site: 'x'
        });
        chrome.runtime.sendMessage = message => {
          if (message.action === 'abortRequest') {
            return Promise.resolve({ success: true });
          }
          if (message.action !== 'translate') {
            return Promise.resolve({ translations: [] });
          }
          return Promise.resolve({
            translations: message.texts.map(pseudoTranslate)
          });
        };

        try {
          startMutationObserver();
          collectViewportBlocks().forEach(block => addToQueue(block));
          await processQueue();
          assert(await waitFor(() => (
            translationRecords.has(document.querySelector('#x-semantic-existing-body'))
            && translationRecords.has(document.querySelector('#x-semantic-sidebar-heading'))
          )), 'initial identifier-free X content was not translated');
          assert(await waitFor(() => isTranslationPipelineIdle()),
            'initial identifier-free X translation did not return to idle');

          document.querySelector('#x-semantic-late-body-shell').innerHTML = `
            <div id="x-semantic-late-body"
                 lang="en"
                 dir="auto"
                 style="display:block;width:580px;min-height:48px">
              A virtualized post body arrived without a tweet text test id.
            </div>
          `;
          document.querySelector('#x-semantic-late-sidebar-shell').innerHTML = `
            <div id="x-semantic-late-trend"
                 lang="en"
                 dir="ltr"
                 style="display:block;width:280px;min-height:48px">
              A late right-column trend must translate while the reader scrolls.
            </div>
            <div id="x-semantic-late-count">8,421 posts</div>
          `;

          assert(await waitFor(() => (
            translationRecords.has(document.querySelector('#x-semantic-late-body'))
            && translationRecords.has(document.querySelector('#x-semantic-late-trend'))
          )), 'late identifier-free X content did not reach the observer pipeline: '
            + JSON.stringify(state.dynamicDiagnostics));
          assert(document.querySelector('#x-semantic-late-body > .oit-translation'),
            'late X post body translation was not rendered');
          assert(document.querySelector('#x-semantic-late-trend > .oit-translation'),
            'late X sidebar translation was not rendered');
          assert(!translationRecords.has(
            document.querySelector('#x-semantic-late-count')
          ), 'late X sidebar count was treated as translatable prose');
          assert(state.dynamicDiagnostics.roots >= 2
              && state.dynamicDiagnostics.candidates >= 2
              && state.dynamicDiagnostics.blocks >= 2,
          'late identifier-free X content bypassed the dynamic pipeline: '
            + JSON.stringify(state.dynamicDiagnostics));
          assert(await waitFor(() => isTranslationPipelineIdle()),
            'late identifier-free X translation did not return to idle');
          assert(state.isActive,
            'late identifier-free X translation stopped future observation');
        } finally {
          chrome.runtime.sendMessage = originalSendMessage;
          removeAllTranslations();
          hideFAB();
          state.fullReset();
        }
      });

      test('scroll events from class-based SPA containers trigger a rescan', async () => {

               style="height:200px">

          </div>
        `;

          showOriginal: true,

          targetLang: 'zh-CN',
          translationScope: 'smart'
        };

        state.shouldStop = false;

        const originalCollectViewportBlocks = collectViewportBlocks;

      test('a dynamic root without candidates reschedules pipeline completion', async () => {
        resetContentState();
        document.body.innerHTML = `
          <main id="completion-main">
            <article><p>Existing readable content keeps the page session active.</p></article>
          </main>
        `;
        state.config = {
          showOriginal: false,
          autoDetect: false,
          targetLang: 'en',
          translationScope: 'smart'
        };
        state.scope = 'smart';
        state.isActive = true;
        state.shouldStop = false;
        state.bodyTranslatedCount = 1;
        state.pipelineSettled = false;
        ensureScanContext();

        const noise = document.createElement('div');
        noise.id = 'non-translatable-noise';
        noise.textContent = '12345';
        document.querySelector('#completion-main').appendChild(noise);
        state.pendingDynamicRoots.add(noise);

        try {
          processDynamicRoots();
          assert(state.pendingDynamicRoots.size === 0,
            'dynamic root was not consumed');

          await sleep(CONFIG.COMPLETION_IDLE + 120);
          assert(state.pipelineSettled,
            'candidate-free dynamic root did not reschedule completion');
          assert(!isTranslationPipelineBusy(),
            'candidate-free dynamic root left the pipeline busy forever');
        } finally {
          state.fullReset();
        }
      });

      test('pending observer bookkeeping does not keep a settled session busy', () => {
        resetContentState();
        document.body.innerHTML = `
          <main><article>
            <p>Completed content remains translated while the SPA keeps mutating.</p>
          </article></main>
        `;
        state.config = {
          showOriginal: false,
          autoDetect: false,
          targetLang: 'en',
          translationScope: 'smart'
        };
        state.scope = 'smart';
        state.isActive = true;

          const deadline = performance.now() + timeout;
          while (performance.now() < deadline) {
            if (predicate()) return true;
            await sleep(20);
          }
          return predicate();
        };
        const isVisibleWithin = element => {
          const rect = element?.getBoundingClientRect();
          if (!rect || rect.width <= 0 || rect.height <= 0) return false;
          let visibleRect = {
            top: rect.top,
            right: rect.right,
            bottom: rect.bottom,
            left: rect.left
          };
          let current = element.parentElement;
          while (current && current !== document.body) {
            const style = getComputedStyle(current);
            if (['hidden', 'clip'].includes(style.overflow)
                || ['hidden', 'clip'].includes(style.overflowY)) {
              const clipRect = current.getBoundingClientRect();
              visibleRect = {
                top: Math.max(visibleRect.top, clipRect.top),
                right: Math.min(visibleRect.right, clipRect.right),
                bottom: Math.min(visibleRect.bottom, clipRect.bottom),
                left: Math.max(visibleRect.left, clipRect.left)
              };

            current = current.parentElement;

            && visibleRect.bottom > visibleRect.top;

              'style',

            controls.push(control);

            `dynamic content path discovered ${state.dynamicDiagnostics.candidates} `
              + `candidates for ${definitions.length} navigation labels`);

          assert(requests.length > 0, 'dynamic navigation labels never reached the provider');

          const requestedText = requests.flatMap(request => request.texts).join(' ');
          for (const [, , label] of definitions) {

              `provider request omitted dynamic navigation label ${label}`);

            assert(isVisibleWithin(label) && isVisibleWithin(translation),
              `dynamic navigation translation is clipped for ${id}`);
            assert(document.querySelector(`#${id}-control`) === controls[index],
              `dynamic navigation control identity changed for ${id}`);
            controls[index].click();
            assert(clicks[index]() === 1,

          assert(snapshot.sessionActive === true,

          assert(snapshot.pipelineBusy === false,
            'dynamic navigation completion left the floating button busy');
          assert(state.translationQueue.length === 0
              && state.inflightRequests.size === 0
              && state.translationTasks.size === 0,
          'dynamic navigation completion left work in queue or transport state');
        } finally {
          chrome.runtime.sendMessage = originalSendMessage;
          removeAllTranslations();
          state.fullReset();
        }
      });

          let visibleRect = {
            top: rect.top,
            right: rect.right,
            bottom: rect.bottom,
            left: rect.left
          };
          let current = element.parentElement;
          while (current && current !== document.body) {
            const style = getComputedStyle(current);
            if (['hidden', 'clip'].includes(style.overflow)
                || ['hidden', 'clip'].includes(style.overflowY)) {
              const clipRect = current.getBoundingClientRect();
              visibleRect = {
                top: Math.max(visibleRect.top, clipRect.top),
                right: Math.min(visibleRect.right, clipRect.right),
                bottom: Math.min(visibleRect.bottom, clipRect.bottom),
                left: Math.max(visibleRect.left, clipRect.left)
              };
            }
            current = current.parentElement;

          return visibleRect.right > visibleRect.left
            && visibleRect.bottom > visibleRect.top;

      test('a hung runtime request times out, releases pipeline state, and permits a clean retry', async () => {
        resetContentState();
        const originalSendMessage = chrome.runtime.sendMessage;
        const originalRuntimeTimeout = CONFIG.RUNTIME_REQUEST_TIMEOUT;
        const abortRequests = [];
        let hungRequestCount = 0;
        let providerAvailable = false;
        const previousFab = fab;
        document.title = 'Hung runtime request regression';
        document.body.innerHTML = `
          <main><article>
            <p id="hung-runtime-host">
              A permanently pending runtime response must not leave the page spinner active forever.
            </p>
          </article></main>
        `;

        state.config = {
          showOriginal: true,
          autoDetect: false,
          targetLang: 'en',
          maxConcurrent: 1,
          translationScope: 'smart'
        };
        CONFIG.RUNTIME_REQUEST_TIMEOUT = 40;
        hideFAB();
        createFAB({ right: 20, top: 120 });

        chrome.runtime.sendMessage = message => {
          if (message.action === 'abortRequest') {
            abortRequests.push(message.requestId);
            return Promise.resolve({ success: true });
          }
          if (message.action === 'translate') {
            if (!providerAvailable) {
              hungRequestCount++;
              return new Promise(() => {});
            }
            return Promise.resolve({
              translations: message.texts.map(pseudoTranslate)
            });
          }
          return Promise.resolve({ success: true });
        };

        const waitFor = async (predicate, timeout = 1500) => {
          const deadline = performance.now() + timeout;
          while (performance.now() < deadline) {
            if (predicate()) return true;
            await sleep(20);
          }
          return predicate();
        };

        try {
          startTranslation(state.config);
          assert(hungRequestCount > 0, 'page translation never sent a runtime request');
          assert(fab?.querySelector('.oit-fab-btn')?.classList.contains('translating'),
            'started translation did not set the FAB busy state');

          const settled = await waitFor(() => (
            state.pipelineSettled
            && state.translationQueue.length === 0
            && state.activeTranslations === 0
            && state.pendingElements.size === 0
            && state.translatingElements.size === 0
            && state.inflightRequests.size === 0
            && state.translationTasks.size === 0
          ));
          assert(settled,
            'hung runtime request left queue, inflight, task, or pending state behind');
          assert(abortRequests.length > 0,
            'timed-out page request was not explicitly aborted in the service worker');
          assert(!isTranslationPipelineBusy(),
            'hung runtime request left the translation pipeline busy');
          assert(!fab?.querySelector('.oit-fab-btn')?.classList.contains('translating'),
            'hung runtime request left the FAB spinner active');

          providerAvailable = true;
          startTranslation(state.config);
          const translated = await waitFor(() => (
            translationRecords.has(document.querySelector('#hung-runtime-host'))
          ));
          assert(translated,
            'a settled active session did not restart and translate the same block');
          const recoveredHost = document.querySelector('#hung-runtime-host');
          const recoveredRecord = translationRecords.get(recoveredHost);
          assert(recoveredHost.querySelector(':scope > .oit-translation'),
            `clean retry rendered ${recoveredRecord?.kind || 'no record'} instead of `
              + `an in-place bilingual translation: ${recoveredHost.outerHTML}`);
          const recovered = await waitFor(() => isTranslationPipelineIdle());
          assert(recovered, 'recovered translation pipeline did not become idle');
          assert(settleTranslationPipeline(),
            'recovered translation pipeline did not settle');
        } finally {
          chrome.runtime.sendMessage = originalSendMessage;
          CONFIG.RUNTIME_REQUEST_TIMEOUT = originalRuntimeTimeout;
          removeAllTranslations();
          hideFAB();
          state.fullReset();
          if (previousFab?.isConnected) fab = previousFab;
        }
      });

      test('an in-flight response cannot overwrite source changed after request start', async () => {
        resetContentState();
        const originalSendMessage = chrome.runtime.sendMessage;
        const originalText = 'The initial plain text document was replaced while translating.';
        const freshText = 'Fresh source text must own the final rendered translation.';
        let translateRequestCount = 0;
        let resolveInitialRequest = null;
        let markInitialRequestStarted;
        const initialRequestStarted = new Promise(resolve => {
          markInitialRequestStarted = resolve;
        });

        document.title = 'In-flight source replacement';
        document.body.innerHTML = `<pre id="racing-plain-text">${originalText}</pre>`;
        state.config = {
          showOriginal: true,
          autoDetect: false,
          targetLang: 'zh-CN',
          maxConcurrent: 2,
          translationScope: 'full'
        };
        state.scope = 'full';
        state.isActive = true;
        state.shouldStop = false;
        state.lifecycle.start();
        state.scanContext = pageScanner.createScanContext({ scope: 'full' });

        chrome.runtime.sendMessage = message => {
          if (message.action === 'abortRequest') return Promise.resolve({ success: true });
          if (message.action !== 'translate') return Promise.resolve({ translations: [] });
          translateRequestCount++;
          if (translateRequestCount > 1) {
            return Promise.resolve({
              translations: message.texts.map(pseudoTranslate)
            });
          }
          return new Promise(resolve => {
            resolveInitialRequest = resolve;
            markInitialRequestStarted();
          });
        };

        try {
          const host = document.querySelector('#racing-plain-text');
          const staleBlock = prepareTranslationBlock(host, { kind: 'plain-text' });
          assert(staleBlock, 'plain text source was not prepared for translation');
          const staleTask = translateBatch([staleBlock]);
          await initialRequestStarted;

          host.textContent = freshText;
          invalidateTranslationSource(host);
          resolveInitialRequest({
            translations: [pseudoTranslate(originalText)]
          });
          await staleTask;

          assert(host.textContent === freshText,
            'a stale in-flight response overwrote the replacement source text');
          assert(!host.nextElementSibling?.classList.contains('oit-translation'),
            'a stale in-flight response rendered beside the replacement source text');

          const freshBlock = prepareTranslationBlock(host, { kind: 'plain-text' });
          assert(freshBlock, 'replacement source text could not be prepared for retranslation');
          await translateBatch([freshBlock]);
          assert(host.nextElementSibling?.textContent.includes('Fresh'),
            'replacement source text was not translated after the stale response settled');
        } finally {
          chrome.runtime.sendMessage = originalSendMessage;
          removeAllTranslations();
          state.fullReset();
        }
      });

        chrome.runtime.sendMessage = message => {

          if (message.action !== 'translate') return Promise.resolve({ translations: [] });
          requests.push(message);
          return Promise.resolve({

          });
        };

        try {
          collectViewportBlocks().forEach(block => addToQueue(block));
          await processQueue();
          assert(await waitFor(() => translationRecords.size > 0
              && isTranslationPipelineIdle()),

          const requestCount = requests.length;

          assert(requests.length === requestCount,
            'extension-owned DOM mutations issued duplicate translation requests');
          assert(translationRecords.size === recordCount,
            'extension-owned DOM mutations created duplicate translation records');
          assert(state.pendingDynamicRoots.size === 0,
            'extension-owned DOM mutations scheduled a dynamic rescan');
          assert(state.dynamicDiagnostics.mutationBatches === 0,
            `extension-owned DOM mutations entered the dynamic pipeline: `
              + `${JSON.stringify(state.dynamicDiagnostics)}`);
          assert(settleTranslationPipeline(),
            'observer-loop regression left the translation pipeline unsettled');
        } finally {
          chrome.runtime.sendMessage = originalSendMessage;
          removeAllTranslations();
          state.fullReset();
        }

        removePendingMark(controlA.element);

      const failures = [];

          failures.push({ name: item.name, error: error.stack || error.message });
        }
      }
      return { total: tests.length, failures };
